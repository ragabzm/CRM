version: 1
project:
  name: CRM-azure
  primaryLanguage: php + Next
  projectRoots:
    - .
tracker:
  type: azure
  workspace: ibbaqi
  project: ragab-crm
naming:
  includeTrackerId: true
  globalSequence: true
agents:
  - claude-code
planner:
  enabled: true
  provider: anthropic
  mode: auto
  budget:
    maxFileReads: 25
    maxContextBytes: 50000
    maxDurationSeconds: 180
  cache:
    enabled: true
  maxOutputTokens: 16384
  auth:
    anthropic: subscription
