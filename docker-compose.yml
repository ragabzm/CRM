# Local stack: five services.
#
# The three backend services run the SAME image and differ only in the command,
# which is the point — web, worker and scheduler are separate processes that
# scale and fail independently while always running identical code.
name: ragab-crm

services:
  postgres:
    # PostgreSQL 18.6, chosen over MySQL because customer and ticket search use
    # trigram and tsvector indexes in later epics rather than a search engine.
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ragab
      POSTGRES_USER: ragab
      POSTGRES_PASSWORD: ragab
    volumes:
      # PostgreSQL 18+ images expect a single mount at /var/lib/postgresql and
      # place the cluster in a major-version subdirectory beneath it. Mounting
      # at .../data (the pre-18 convention) makes the entrypoint refuse to start.
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragab -d ragab"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend-web:
    build: ./backend
    command: ["web"]
    environment: &backend-env
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-base64:Zm9vYmFyYmF6cXV4Zm9vYmFyYmF6cXV4MTIzNDU2Nzg=}
      APP_URL: http://localhost:8000
      LOG_CHANNEL: json
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ragab
      DB_USERNAME: ragab
      DB_PASSWORD: ragab
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  backend-worker:
    build: ./backend
    command: ["worker"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      # The web process owns migrations, so the worker waits for it rather than
      # racing it to create the jobs table.
      backend-web:
        condition: service_started

  backend-scheduler:
    build: ./backend
    command: ["scheduler"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      backend-web:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      # Reached from the browser on the host, not from inside the network.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      # Reached from the Next.js server, which IS inside the network. The
      # server-side session gate calls this one; `localhost` here would be the
      # frontend container talking to itself.
      API_INTERNAL_BASE_URL: http://backend-web:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend-web

volumes:
  pgdata: {}
