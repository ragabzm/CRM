# Module boundaries and tier ordering.
#
# One layer per module so that same-tier dependencies are visible: a per-tier
# layering would let Sla depend on Email (deptrac permits intra-layer edges by
# default), and modules that share a tier must not call each other.
#
# The allowed lists below are exactly "every module in a strictly lower tier",
# derived from app/Modules/module-tiers.php.
deptrac:
  paths:
    - ./app/Modules

  layers:
    - name: T0_Platform
      collectors:
        - type: directory
          value: app/Modules/Platform/.*
    - name: T1_Security
      collectors:
        - type: directory
          value: app/Modules/Security/.*
    - name: T1_Ai
      collectors:
        - type: directory
          value: app/Modules/Ai/.*
    - name: T2_Customers
      collectors:
        - type: directory
          value: app/Modules/Customers/.*
    - name: T2_Knowledge
      collectors:
        - type: directory
          value: app/Modules/Knowledge/.*
    - name: T3_Tickets
      collectors:
        - type: directory
          value: app/Modules/Tickets/.*
    - name: T4_Sla
      collectors:
        - type: directory
          value: app/Modules/Sla/.*
    - name: T4_Channels
      collectors:
        - type: directory
          value: app/Modules/Channels/.*
    - name: T5_Email
      collectors:
        - type: directory
          value: app/Modules/Email/.*
    - name: T4_Portal
      collectors:
        - type: directory
          value: app/Modules/Portal/.*
    - name: T4_Assist
      collectors:
        - type: directory
          value: app/Modules/Assist/.*
    - name: T5_Reporting
      collectors:
        - type: directory
          value: app/Modules/Reporting/.*
    - name: T4_Integrations
      collectors:
        - type: directory
          value: app/Modules/Integrations/.*

    # Everything the modules are allowed to reach that is not itself a module.
    # Declaring these explicitly is what makes --fail-on-uncovered meaningful:
    # an unlisted dependency becomes a build failure rather than a silent
    # "uncovered" line nobody reads.
    - name: Vendor
      collectors:
        - type: classNameRegex
          value: '#^(Illuminate|Symfony|Laravel|Monolog|Psr|Dedoc|Carbon|Ramsey|Brick|Nesbot|ZBateson|Spatie)\\.*#'
    - name: AppShared
      collectors:
        - type: classNameRegex
          value: '#^App\\(?!Modules\\).*#'
    - name: PhpInternal
      collectors:
        - type: php_internal
          value: '.*'

  ruleset:
    T4_Sla: [T3_Tickets, T2_Customers, T1_Security, T1_Ai, T0_Platform, Vendor, AppShared, PhpInternal]
    # Reporting reads Tickets and Sla and writes nothing. It does not reach
    # Channels or Email: a report about a channel's own tables is not a report
    # about tickets.
    # The assists read the conversation and the article corpus, and write
    # nothing. Knowledge is in this list and in no other module's — Tickets
    # still does not know it exists.
    T4_Assist: [T3_Tickets, T2_Knowledge, T2_Customers, T1_Security, T1_Ai, T0_Platform, Vendor, AppShared, PhpInternal]
    # Customers is here for the contract it writes imported records through —
    # never a direct write. Tickets is deliberately absent: an ERP adapter has
    # no business knowing this product has tickets.
    T4_Integrations: [T2_Customers, T1_Security, T0_Platform, Vendor, AppShared, PhpInternal]
    T5_Reporting: [T4_Sla, T3_Tickets, T2_Customers, T1_Security, T1_Ai, T0_Platform, Vendor, AppShared, PhpInternal]
    T5_Email: [T4_Integrations, T4_Channels, T3_Tickets, T2_Customers, T1_Security, T1_Ai, T0_Platform, Vendor, AppShared, PhpInternal]
    # Knowledge is here for the chatbot and for nothing else: the widget
    # answers from published articles, so the channel that owns the widget has
    # to be able to read them. Tickets still does not know Knowledge exists.
    T4_Channels: [T3_Tickets, T2_Knowledge, T2_Customers, T1_Security, T1_Ai, T0_Platform, Vendor, AppShared, PhpInternal]
    T4_Portal: [T3_Tickets, T2_Customers, T1_Security, T1_Ai, T0_Platform, Vendor, AppShared, PhpInternal]
    T3_Tickets: [T2_Customers, T1_Security, T1_Ai, T0_Platform, Vendor, AppShared, PhpInternal]
    T2_Customers: [T1_Security, T1_Ai, T0_Platform, Vendor, AppShared, PhpInternal]
    T2_Knowledge: [T1_Security, T1_Ai, T0_Platform, Vendor, AppShared, PhpInternal]
    # Ai reaches Platform and nothing else. A connector that could read
    # Tickets or Knowledge would be one the product could not run without.
    T1_Ai: [T0_Platform, Vendor, AppShared, PhpInternal]
    T1_Security: [T0_Platform, Vendor, AppShared, PhpInternal]
    T0_Platform: [Vendor, AppShared, PhpInternal]
    Vendor: ~
    AppShared: ~
    PhpInternal: ~
