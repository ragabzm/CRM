# Tier ordering, checked at tier granularity.
#
# Coarser than deptrac.yaml on purpose: this config answers "does anything reach
# up the stack" independently of how the modules are grouped. Same-tier edges
# are deliberately NOT policed here — deptrac.yaml owns that rule.
#
# EVERY MODULE MUST BE LISTED. A module missing from here is not refused, it is
# UNCOVERED — and uncovered only fails the build once something actually
# depends on it across a boundary. Ai, Assist and Reporting were each added by
# a story and each missed this file; the gap surfaced three stories later, when
# the chatbot became the first thing to reach Ai from another tier.
# `TierConfigsAgreeTest` now fails the moment a module is added without a home
# here.
deptrac:
  paths:
    - ./app/Modules

  layers:
    - name: T0
      collectors:
        - type: directory
          value: app/Modules/Platform/.*
    - name: T1
      collectors:
        - type: directory
          value: app/Modules/(Security|Ai)/.*
    - name: T2
      collectors:
        - type: directory
          value: app/Modules/(Customers|Knowledge)/.*
    - name: T3
      collectors:
        - type: directory
          value: app/Modules/Tickets/.*
    - name: T4
      collectors:
        - type: directory
          value: app/Modules/(Sla|Portal|Channels|Assist|Integrations)/.*
    - name: T5
      collectors:
        - type: directory
          value: app/Modules/(Email|Reporting)/.*

    # Everything the modules are allowed to reach that is not itself a module.
    # Declaring these explicitly is what makes --fail-on-uncovered meaningful:
    # an unlisted dependency becomes a build failure rather than a silent
    # "uncovered" line nobody reads.
    - name: Vendor
      collectors:
        - type: classNameRegex
          value: '#^(Illuminate|Symfony|Laravel|Monolog|Psr|Dedoc|Carbon|Ramsey|Brick|Nesbot|ZBateson|Spatie)\\.*#'
    - name: AppShared
      collectors:
        - type: classNameRegex
          value: '#^App\\(?!Modules\\).*#'
    - name: PhpInternal
      collectors:
        - type: php_internal
          value: '.*'

  ruleset:
    T5: [T4, T3, T2, T1, T0, Vendor, AppShared, PhpInternal]
    T4: [T3, T2, T1, T0, Vendor, AppShared, PhpInternal]
    T3: [T2, T1, T0, Vendor, AppShared, PhpInternal]
    T2: [T1, T0, Vendor, AppShared, PhpInternal]
    T1: [T0, Vendor, AppShared, PhpInternal]
    T0: [Vendor, AppShared, PhpInternal]
    Vendor: ~
    AppShared: ~
    PhpInternal: ~
