components:
  schemas:
    AppendMessageRequest:
      type: object
      description: 'No `version` rule, deliberately — see AppendMessage.'
      properties:
        body:
          type: string
          minLength: 1.0
          maxLength: 20000.0
        direction:
          type: string
          enum:
            - inbound
            - outbound
            - internal
        attachment_ids:
          type: array
          description: "Ids of files already uploaded against this ticket. Sent as a list\nrather than as the files themselves so a slow or refused upload\nnever costs the agent the reply they typed."
          items:
            type: string
            minLength: 26.0
            maxLength: 26.0
          maxItems: 10.0
      required:
        - body
      title: AppendMessageRequest
    AssignTicketRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1.0
        assignee_id:
          type:
            - integer
            - 'null'
          description: "Present but null returns the ticket to the pool, which is a real\ninstruction and not the same as omitting the field."
      required:
        - version
        - assignee_id
      title: AssignTicketRequest
    ChangeDepartmentRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1.0
        department_id:
          type: integer
          description: "Existence is checked by the command, not by an `exists` rule, so\nthe refusal is `tickets.department_invalid` with the id echoed\nback rather than a generic validation error the UI cannot act on."
        reason:
          type:
            - string
            - 'null'
          maxLength: 500.0
      required:
        - version
        - department_id
      title: ChangeDepartmentRequest
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          description: "Proves the person at the keyboard is the account holder, not\nsomeone who found an unlocked screen."
        password:
          type: string
        password_confirmation:
          type: string
      required:
        - current_password
        - password
        - password_confirmation
      title: ChangePasswordRequest
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255.0
      required:
        - email
      title: ForgotPasswordRequest
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: "Deliberately NOT validated against the password policy. The policy\ngoverns passwords being SET; applying it here would tell an\nattacker the shape of a valid password before they ever guess one,\nand would lock out any account whose password predates a policy\nchange."
          maxLength: 255.0
        password:
          type: string
        remember:
          type: boolean
      required:
        - email
        - password
      title: LoginRequest
    PreviewDuplicatesRequest:
      type: object
      properties:
        emails:
          type: array
          items:
            type: string
            maxLength: 200.0
          maxItems: 20.0
        phones:
          type: array
          items:
            type: string
            maxLength: 200.0
          maxItems: 20.0
        exclude_customer_id:
          type: string
          description: "Set when checking an EXISTING customer's edits, so they are not\noffered as their own duplicate."
          minLength: 26.0
          maxLength: 26.0
      title: PreviewDuplicatesRequest
    RegisterPortalAccountRequest:
      type: object
      description: "What a customer has to give to open an account.\n\nFour fields, and no more. Every extra one is a reason somebody abandons a\nform they only opened because something had already gone wrong."
      properties:
        name:
          type: string
          minLength: 1.0
          maxLength: 120.0
        email:
          type: string
          format: email
          maxLength: 320.0
        password:
          type: string
        preferred_locale:
          type:
            - string
            - 'null'
          description: "`nullable` as well as `sometimes`: an explicit null means \"I have\nno preference\", which is a legitimate thing for a client to say\nand different from sending nothing. Both fall back to English."
          enum:
            - en
            - ar
            - null
        password_confirmation:
          type: string
      required:
        - name
        - email
        - password
        - password_confirmation
      title: RegisterPortalAccountRequest
    ReopenTicketRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1.0
        reason:
          type:
            - string
            - 'null'
          maxLength: 500.0
      required:
        - version
      title: ReopenTicketRequest
    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
        email:
          type: string
          format: email
          maxLength: 255.0
        password:
          type: string
        password_confirmation:
          type: string
      required:
        - token
        - email
        - password
        - password_confirmation
      title: ResetPasswordRequest
    ResolveTicketRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1.0
        resolution_note:
          type: string
          minLength: 1.0
          maxLength: 2000.0
      required:
        - version
        - resolution_note
      title: ResolveTicketRequest
    StoreAttachmentRequest:
      type: object
      properties:
        owner_type:
          type: string
          enum:
            - customer
            - ticket
            - message
        owner_id:
          type: string
          description: "ULID-shaped, and that is as far as the check goes. Platform is T0 and cannot look inside Customers or Tickets to\nconfirm the owner exists — a query from here would invert the\ndependency graph. The owning module checks existence when it\nbuilds the upload, and an attachment pointing at nothing is\ninvisible rather than dangerous: it is only ever read through\n\"everything attached to THIS record\"."
          minLength: 26.0
          maxLength: 26.0
        file:
          type: string
          format: binary
          contentMediaType: application/octet-stream
          description: "No `max` and no `mimes` here on purpose. The size cap and the\nallow-list are runtime settings an administrator controls, and\nbaking them into a validation rule would freeze them at deploy\ntime. AttachmentUploader applies both, against the current values."
      required:
        - owner_type
        - owner_id
        - file
      title: StoreAttachmentRequest
    StoreCustomerRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1.0
          maxLength: 200.0
        department_id:
          type: integer
        preferred_channel:
          type:
            - string
            - 'null'
          enum:
            - email
            - phone
            - null
        notes:
          type:
            - string
            - 'null'
          maxLength: 10000.0
        identifiers:
          type: array
          description: "At least one way to reach them. A customer record with no contact\ndetails cannot be replied to, which makes it a name in a list\nrather than a customer."
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                  - email
                  - phone
              value:
                type: string
                minLength: 1.0
                maxLength: 200.0
              is_primary:
                type: boolean
            required:
              - kind
              - value
          minItems: 1.0
        confirm_create_duplicate:
          type: boolean
          description: "The client's acknowledgement of an offered duplicate."
      required:
        - full_name
        - department_id
        - identifiers
      title: StoreCustomerRequest
    StoreDepartmentRequest:
      type: object
      properties:
        name:
          type: string
          description: "max:120 counts CHARACTERS, not bytes, so an Arabic department\nname is not silently shorter than an English one."
          minLength: 1.0
          maxLength: 120.0
      required:
        - name
      title: StoreDepartmentRequest
    StoreTicketRequest:
      type: object
      properties:
        subject:
          type: string
          minLength: 1.0
          maxLength: 200.0
        description:
          type: string
          minLength: 1.0
          maxLength: 20000.0
        customer_id:
          type: string
          minLength: 26.0
          maxLength: 26.0
        channel:
          type: string
          enum:
            - agent
            - portal
            - email
            - system
        category_id:
          type:
            - integer
            - 'null'
        priority:
          type:
            - string
            - 'null'
          enum:
            - low
            - normal
            - high
            - urgent
            - null
        department_id:
          type:
            - integer
            - 'null'
      required:
        - subject
        - description
        - customer_id
        - channel
      title: StoreTicketRequest
    StoreUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1.0
          maxLength: 120.0
        email:
          type: string
          format: email
          maxLength: 255.0
        role:
          type: string
          enum:
            - administrator
            - supervisor
            - agent
            - customer
        department_id:
          type:
            - integer
            - 'null'
        is_active:
          type: boolean
        password:
          type:
            - string
            - 'null'
          description: "Optional: omitted means the account is created without a usable\npassword and the person sets one through the reset flow, which is\nbetter than an administrator inventing and transmitting one."
        password_confirmation:
          type:
            - string
            - 'null'
      required:
        - name
        - email
        - role
      title: StoreUserRequest
    UpdateCustomerRequest:
      type: object
      description: "Every field optional; supplying `identifiers` replaces the whole set.\n\nReplacement rather than merge, because the form the agent is looking at shows\nthe complete list — the rows they deleted are gone from what they submit, and\na merge would silently resurrect them."
      properties:
        full_name:
          type: string
          minLength: 1.0
          maxLength: 200.0
        department_id:
          type: integer
        preferred_channel:
          type:
            - string
            - 'null'
          enum:
            - email
            - phone
            - null
        notes:
          type:
            - string
            - 'null'
          maxLength: 10000.0
        identifiers:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                  - email
                  - phone
              value:
                type: string
                minLength: 1.0
                maxLength: 200.0
              is_primary:
                type: boolean
          minItems: 1.0
      title: UpdateCustomerRequest
    UpdateDepartmentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1.0
          maxLength: 120.0
        is_active:
          type: boolean
      required:
        - name
      title: UpdateDepartmentRequest
    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1.0
          maxLength: 120.0
        preferred_locale:
          type: string
          description: "The two locales the product ships. An unknown value is a 422\nrather than a silent fallback, so a typo surfaces at the source."
          enum:
            - en
            - ar
      title: UpdateProfileRequest
    UpdateTicketAttributesRequest:
      type: object
      description: "A partial change. Every attribute optional, the version required.\n\nThe version is required even though the guard would tolerate null, because a\ncaller who omitted it would be silently opting out of the protection this\nwhole mechanism exists for.\n\nIt may arrive in the body as `version` or in an `If-Match` header — the same\nnumber, spelled the way the caller finds natural. There is still ONE guard\nreading ONE value; a second mechanism would be a second thing to get wrong,\nand the one that is wrong is the one nobody tested."
      properties:
        version:
          type: integer
          description: 'Required only when the header did not carry it.'
          minimum: 1.0
        status:
          type: string
          enum:
            - open
            - pending
            - resolved
            - closed
        priority:
          type: string
          enum:
            - low
            - normal
            - high
            - urgent
        category_id:
          type:
            - integer
            - 'null'
        assignee_id:
          type:
            - integer
            - 'null'
        department_id:
          type:
            - integer
            - 'null'
      title: UpdateTicketAttributesRequest
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1.0
          maxLength: 120.0
        email:
          type: string
          format: email
          maxLength: 255.0
        role:
          type: string
          enum:
            - administrator
            - supervisor
            - agent
            - customer
        department_id:
          type:
            - integer
            - 'null'
        is_active:
          type: boolean
      title: UpdateUserRequest
    Problem:
      type: object
      title: Problem
      description: 'RFC 9457 problem details. Every 4xx and 5xx response in this API has this shape.'
      properties:
        type:
          type: string
          format: uri
          description: 'A URI identifying the problem type. Always the base URI plus `code`.'
        title:
          type: string
          description: 'A short, human-readable summary.'
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type:
            - string
            - 'null'
          description: 'A human-readable explanation specific to this occurrence.'
        instance:
          type: string
          description: 'The request URI this problem occurred on.'
        code:
          type: string
          pattern: '^[a-z0-9_]+\.[a-z0-9_]+$'
          description: 'Stable machine identifier shaped `module.condition`. Branch on this, never on `title`.'
          examples:
            - platform.internal_error
            - platform.validation_failed
            - platform.unauthorized
            - platform.forbidden
            - platform.not_found
            - platform.method_not_allowed
            - platform.conflict
            - platform.too_many_requests
            - platform.request_failed
            - platform.idempotency_conflict
            - platform.idempotency_in_flight
        trace_id:
          type: string
          description: 'Correlation id for this request; matches the X-Request-Id response header and the request_id in the logs.'
        errors:
          type: object
          description: 'Present on validation failures: field name to list of messages.'
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - type
        - title
        - status
        - instance
        - code
        - trace_id
  responses:
    ValidationException:
      description: 'Validation error'
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: 'Errors overview.'
              errors:
                type: object
                description: 'A detailed description of each field that failed validation.'
                additionalProperties:
                  type: array
                  items:
                    type: string
            required:
              - message
              - errors
    AuthenticationException:
      description: Unauthenticated
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: 'Error overview.'
            required:
              - message
    AuthorizationException:
      description: 'Authorization error'
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: 'Error overview.'
            required:
              - message
    ModelNotFoundException:
      description: 'Not found'
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: 'Error overview.'
            required:
              - message
