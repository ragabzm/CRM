  /tickets:
    get:
      operationId: tickets.index
      description: "Read-only, so no Idempotency-Key. Scoped by TicketVisibility before any\ncaller-supplied filter is applied — an agent who puts a colleague's id in\nthe URL gets their own tickets back rather than a refusal, because the\nfilter narrows what they may see and never widens it."
      summary: 'The ticket list'
      tags:
        - Tickets
      parameters:
        -
          name: 'status[]'
          in: query
          schema:
            type: array
            enum:
              - open
              - pending
              - resolved
              - closed
            items:
              type: string
              enum:
                - open
                - pending
                - resolved
                - closed
        -
          name: 'priority[]'
          in: query
          schema:
            type: array
            enum:
              - low
              - normal
              - high
              - urgent
            items:
              type: string
              enum:
                - low
                - normal
                - high
                - urgent
        -
          name: 'category_id[]'
          in: query
          schema:
            type: array
            items:
              type: integer
        -
          name: 'assignee_id[]'
          in: query
          description: 'Either a user id or the "nobody has picked this up" sentinel.'
          schema:
            type: array
            items:
              type: string
        -
          name: 'department_id[]'
          in: query
          schema:
            type: array
            items:
              type: integer
        -
          name: sla_state
          in: query
          description: "Named states only. This is answered by computing the reading for\nthe live queue, so an arbitrary string would be a walk over\nevery open ticket that could never match anything."
          schema:
            type: string
            enum:
              - on_track
              - at_risk
              - breached
              - met
              - paused
        -
          name: escalated
          in: query
          description: "A filter, never a status. Escalation is a property an open,\npending, resolved or closed ticket can carry — `?escalated=1`\nnarrows within the lifecycle rather than replacing it."
          schema:
            type: boolean
        -
          name: created_from
          in: query
          schema:
            type: string
            format: date-time
        -
          name: created_to
          in: query
          schema:
            type: string
            format: date-time
        -
          name: q
          in: query
          schema:
            type:
              - string
              - 'null'
            maxLength: 200.0
        -
          name: sort
          in: query
          schema:
            type: string
            enum:
              - updated_at
              - created_at
              - priority
              - reference
              - status
        -
          name: direction
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
        -
          name: per_page
          in: query
          description: "Capped rather than unbounded: a caller asking for ten thousand\nrows gets a page, not an outage."
          schema:
            type: integer
            minimum: 1.0
            maximum: 100.0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: {}
                  meta:
                    type: object
                    additionalProperties:
                      type: integer
                required:
                  - data
                  - meta
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '422':
          $ref: '#/components/responses/ValidationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: tickets.store
      tags:
        - Tickets
      requestBody:
        required: true
        content:
          application/json:
            schema:
