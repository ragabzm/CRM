openapi: 3.1.0
info:
  title: 'Ragab CRM API'
  version: 1.0.0
  description: 'Ragab CRM API. Errors are RFC 9457 application/problem+json documents whose `code` member is a stable `module.condition` identifier. Write endpoints require an Idempotency-Key header (ULID or UUID).'
servers:
  -
    url: /api/v1
    description: 'Relative to the deployment host, e.g. http://localhost:8000 locally.'
paths:
  /audit:
    get:
      operationId: audit.index
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string
                    minItems: 0
                    maxItems: 0
                    additionalItems: false
                required:
                  - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/settings/{key}':
    put:
      operationId: settings.update
      parameters:
        -
          name: key
          in: path
          required: true
          schema:
            type: string
        -
          name: Idempotency-Key
          in: header
          required: true
          description: 'A ULID or UUID that identifies this write attempt. Repeating a request with the same key replays the stored response instead of acting twice; reusing a key with a different body returns 409. Keys are retained for 24 hours.'
          schema:
            type: string
            maxLength: 40
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                required:
                  - key
        '401':
          $ref: '#/components/responses/AuthenticationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'The Idempotency-Key was already used for a different request (code: platform.idempotency_conflict).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '425':
          description: 'A concurrent request with the same Idempotency-Key is still in flight (code: platform.idempotency_in_flight).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /admin/knowledge/categories:
    get:
      operationId: admin.knowledge.categories.index
      tags:
        - ArticleCategories
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: object
                          properties:
                            en:
                              type: string
                            ar:
                              type: string
                          required:
                            - en
                            - ar
                        sort_order:
                          type: integer
                        article_count:
                          type: integer
                      required:
                        - id
                        - name
                        - sort_order
                        - article_count
                required:
                  - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: admin.knowledge.categories.store
      tags:
        - ArticleCategories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: object
                  properties:
                    en:
                      type: string
                      description: "No `parent` rule, because there is no parent. Flat by\nconstruction — see the migration."
                      minLength: 1.0
                      maxLength: 120.0
                    ar:
                      type: string
                      minLength: 1.0
                      maxLength: 120.0
                  required:
                    - en
                    - ar
              required:
                - name
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: object
                    properties:
                      en:
                        type: string
                      ar:
                        type: string
                    required:
                      - en
                      - ar
                  sort_order:
                    type: integer
                  article_count:
                    type: integer
                required:
                  - id
                  - name
                  - sort_order
                  - article_count
        '422':
          $ref: '#/components/responses/ValidationException'
        '401':
          $ref: '#/components/responses/AuthenticationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'The Idempotency-Key was already used for a different request (code: platform.idempotency_conflict).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '425':
          description: 'A concurrent request with the same Idempotency-Key is still in flight (code: platform.idempotency_in_flight).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
        -
          name: Idempotency-Key
          in: header
          required: true
          description: 'A ULID or UUID that identifies this write attempt. Repeating a request with the same key replays the stored response instead of acting twice; reusing a key with a different body returns 409. Keys are retained for 24 hours.'
          schema:
            type: string
            maxLength: 40
  '/admin/knowledge/categories/{category}':
    patch:
      operationId: admin.knowledge.categories.update
      tags:
        - ArticleCategories
      parameters:
        -
          name: category
          in: path
          required: true
          description: 'The category ID'
          schema:
            type: integer
        -
          name: Idempotency-Key
          in: header
          required: true
          description: 'A ULID or UUID that identifies this write attempt. Repeating a request with the same key replays the stored response instead of acting twice; reusing a key with a different body returns 409. Keys are retained for 24 hours.'
          schema:
            type: string
            maxLength: 40
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: object
                  properties:
                    en:
                      type: string
                      description: "No `parent` rule, because there is no parent. Flat by\nconstruction — see the migration."
                      minLength: 1.0
                      maxLength: 120.0
                    ar:
                      type: string
                      minLength: 1.0
                      maxLength: 120.0
                  required:
                    - en
                    - ar
              required:
                - name
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: object
                    properties:
                      en:
                        type: string
                      ar:
                        type: string
                    required:
                      - en
                      - ar
                  sort_order:
                    type: integer
                  article_count:
                    type: integer
                    minimum: 0
                required:
                  - id
                  - name
                  - sort_order
                  - article_count
        '422':
          $ref: '#/components/responses/ValidationException'
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '401':
          $ref: '#/components/responses/AuthenticationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'The Idempotency-Key was already used for a different request (code: platform.idempotency_conflict).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '425':
          description: 'A concurrent request with the same Idempotency-Key is still in flight (code: platform.idempotency_in_flight).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      operationId: admin.knowledge.categories.destroy
      description: "Every article belongs to exactly one category, so deleting an occupied\none has no correct outcome: the articles cannot be left pointing at\nnothing, and moving them somewhere the administrator did not choose is a\ndecision this endpoint has no business making."
      summary: 'Delete — refused while articles still sit in it'
      tags:
        - ArticleCategories
      parameters:
        -
          name: category
          in: path
          required: true
          description: 'The category ID'
          schema:
            type: integer
        -
          name: Idempotency-Key
          in: header
          required: true
          description: 'A ULID or UUID that identifies this write attempt. Repeating a request with the same key replays the stored response instead of acting twice; reusing a key with a different body returns 409. Keys are retained for 24 hours.'
          schema:
            type: string
            maxLength: 40
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
                required:
                  - deleted
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '401':
          $ref: '#/components/responses/AuthenticationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'The Idempotency-Key was already used for a different request (code: platform.idempotency_conflict).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '425':
          description: 'A concurrent request with the same Idempotency-Key is still in flight (code: platform.idempotency_in_flight).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/admin/knowledge/articles/{article}/publish':
    post:
      operationId: admin.knowledge.articles.publish
      summary: 'Draft or Archived → Published'
      tags:
        - ArticleLifecycle
      parameters:
        -
          name: article
          in: path
          required: true
          description: 'The article ID'
          schema:
            type: string
        -
          name: Idempotency-Key
          in: header
          required: true
          description: 'A ULID or UUID that identifies this write attempt. Repeating a request with the same key replays the stored response instead of acting twice; reusing a key with a different body returns 409. Keys are retained for 24 hours.'
          schema:
            type: string
            maxLength: 40
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '401':
          $ref: '#/components/responses/AuthenticationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'The Idempotency-Key was already used for a different request (code: platform.idempotency_conflict).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '425':
          description: 'A concurrent request with the same Idempotency-Key is still in flight (code: platform.idempotency_in_flight).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/admin/knowledge/articles/{article}/archive':
    post:
      operationId: admin.knowledge.articles.archive
      summary: 'Published → Archived'
      tags:
        - ArticleLifecycle
      parameters:
        -
          name: article
          in: path
          required: true
          description: 'The article ID'
          schema:
            type: string
        -
          name: Idempotency-Key
          in: header
          required: true
          description: 'A ULID or UUID that identifies this write attempt. Repeating a request with the same key replays the stored response instead of acting twice; reusing a key with a different body returns 409. Keys are retained for 24 hours.'
          schema:
            type: string
            maxLength: 40
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '401':
          $ref: '#/components/responses/AuthenticationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'The Idempotency-Key was already used for a different request (code: platform.idempotency_conflict).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '425':
          description: 'A concurrent request with the same Idempotency-Key is still in flight (code: platform.idempotency_in_flight).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /knowledge/search:
    get:
      operationId: knowledge.search
      tags:
        - ArticleSearch
      parameters:
        -
          name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 200.0
        -
          name: limit
          in: query
          schema:
            type: integer
            minimum: 1.0
            maximum: 50.0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: {}
                required:
                  - data
        '422':
          $ref: '#/components/responses/ValidationException'
        '401':
          $ref: '#/components/responses/AuthenticationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/admin/knowledge/articles/{article}/translations/{locale}':
    put:
      operationId: admin.knowledge.articles.translations.upsert
      tags:
        - ArticleTranslations
      parameters:
        -
          name: article
          in: path
          required: true
          description: 'The article ID'
          schema:
            type: string
        -
          name: locale
          in: path
          required: true
          schema:
            type: string
        -
          name: Idempotency-Key
          in: header
          required: true
          description: 'A ULID or UUID that identifies this write attempt. Repeating a request with the same key replays the stored response instead of acting twice; reusing a key with a different body returns 409. Keys are retained for 24 hours.'
          schema:
            type: string
            maxLength: 40
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertArticleTranslationRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '422':
          $ref: '#/components/responses/ValidationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'The Idempotency-Key was already used for a different request (code: platform.idempotency_conflict).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '425':
          description: 'A concurrent request with the same Idempotency-Key is still in flight (code: platform.idempotency_in_flight).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      operationId: admin.knowledge.articles.translations.destroy
      description: "Refused for the article's default language while others exist, because\nthe default is the fallback every reader lands on when theirs is\nmissing. Removing it turns \"we do not have your language\" into a blank\npage."
      summary: 'Removes one language version'
      tags:
        - ArticleTranslations
      parameters:
        -
          name: article
          in: path
          required: true
          description: 'The article ID'
          schema:
            type: string
        -
          name: locale
          in: path
          required: true
          schema:
            type: string
        -
          name: Idempotency-Key
          in: header
          required: true
          description: 'A ULID or UUID that identifies this write attempt. Repeating a request with the same key replays the stored response instead of acting twice; reusing a key with a different body returns 409. Keys are retained for 24 hours.'
          schema:
            type: string
            maxLength: 40
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
                  category_id:
                    type: integer
                  internal_only:
                    type: boolean
                  status:
                    type: string
                  default_locale:
                    type: string
                  available_locales:
                    type: array
                    description: "Which languages exist, so a list can show an availability chip\nwithout fetching every body. An article that exists only in\nArabic is complete, not half-finished, and the chip is what says\nso."
                    items: {}
                  title:
                    type:
                      - string
                      - 'null'
                    description: "The title, in whichever language the reader would be served. On the LIST too, not only on the record. An article list showing\nidentifiers is a list nobody can find anything in — and the\nidentifier is the one thing about an article that means nothing\nto the person reading it."
                  is_customer_visible:
                    type: boolean
                    description: "Never inferred by the caller from `status` and `internal_only`.\nBoth conditions, in one place — see `Article::isCustomerVisible`."
                  can_delete:
                    type: boolean
                    description: "The interface offers Delete or Archive based on this, and the\nserver refuses on the same rule. Two answers computed once."
                  has_been_published:
                    type: boolean
                  published_at:
                    type:
                      - string
                      - 'null'
                  published_by:
                    type:
                      - string
                      - 'null'
                  archived_at:
                    type:
                      - string
                      - 'null'
                  archived_by:
                    type:
                      - string
                      - 'null'
                  created_at:
                    type:
                      - string
                      - 'null'
                  updated_at:
                    type:
                      - string
                      - 'null'
                  '':
                    anyOf:
                      -
                        type: array
                        items:
                          type: string
                        minItems: 0
                        maxItems: 0
                        additionalItems: false
                      -
                        type: object
                        properties:
                          served_locale:
                            type: 'null'
                          title:
                            type:
                              - string
                              - 'null'
                          body:
                            type:
                              - string
                              - 'null'
                          translations:
                            type: array
                            items: {}
                        required:
                          - served_locale
                          - title
                          - body
                          - translations
                required:
                  - id
                  - type
                  - category_id
                  - internal_only
                  - status
                  - default_locale
                  - available_locales
                  - title
                  - is_customer_visible
                  - can_delete
                  - has_been_published
                  - published_at
                  - published_by
                  - archived_at
                  - archived_by
                  - created_at
                  - updated_at
                  - null
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '401':
          $ref: '#/components/responses/AuthenticationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'The Idempotency-Key was already used for a different request (code: platform.idempotency_conflict).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '425':
          description: 'A concurrent request with the same Idempotency-Key is still in flight (code: platform.idempotency_in_flight).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /admin/knowledge/articles:
    get:
      operationId: admin.knowledge.articles.index
      tags:
        - Articles
      parameters:
        -
          name: type
          in: query
          schema:
            type: string
            enum:
              - faq
              - help
              - solution
              - guide
        -
          name: status
          in: query
          schema:
            type: string
            enum:
              - draft
              - published
              - archived
        -
          name: category_id
          in: query
          schema:
            type: integer
        -
          name: internal_only
          in: query
          schema:
            type: boolean
        -
          name: q
          in: query
          schema:
            type: string
            maxLength: 200.0
        -
          name: per_page
          in: query
          schema:
            type: integer
            minimum: 1.0
            maximum: 100.0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: {}
                  meta:
                    type: object
                    additionalProperties:
                      type: integer
                required:
                  - data
                  - meta
        '422':
          $ref: '#/components/responses/ValidationException'
        '401':
          $ref: '#/components/responses/AuthenticationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: admin.knowledge.articles.store
      tags:
        - Articles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreArticleRequest'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
                  category_id:
                    type: integer
                  internal_only:
                    type: boolean
                  status:
                    type: string
                  default_locale:
                    type: string
                  available_locales:
                    type: array
                    description: "Which languages exist, so a list can show an availability chip\nwithout fetching every body. An article that exists only in\nArabic is complete, not half-finished, and the chip is what says\nso."
                    items: {}
                  title:
                    type:
                      - string
                      - 'null'
                    description: "The title, in whichever language the reader would be served. On the LIST too, not only on the record. An article list showing\nidentifiers is a list nobody can find anything in — and the\nidentifier is the one thing about an article that means nothing\nto the person reading it."
                  is_customer_visible:
                    type: boolean
                    description: "Never inferred by the caller from `status` and `internal_only`.\nBoth conditions, in one place — see `Article::isCustomerVisible`."
                  can_delete:
                    type: boolean
                    description: "The interface offers Delete or Archive based on this, and the\nserver refuses on the same rule. Two answers computed once."
                  has_been_published:
                    type: boolean
                  published_at:
                    type:
                      - string
                      - 'null'
                  published_by:
                    type:
                      - string
                      - 'null'
                  archived_at:
                    type:
                      - string
                      - 'null'
                  archived_by:
                    type:
                      - string
                      - 'null'
                  created_at:
                    type:
                      - string
                      - 'null'
                  updated_at:
                    type:
                      - string
                      - 'null'
                  '':
                    anyOf:
                      -
                        type: array
                        items:
                          type: string
                        minItems: 0
                        maxItems: 0
                        additionalItems: false
                      -
                        type: object
                        properties:
                          served_locale:
                            type: 'null'
                          title:
                            type:
                              - string
                              - 'null'
                          body:
                            type:
                              - string
                              - 'null'
                          translations:
                            type: array
                            items: {}
                        required:
                          - served_locale
                          - title
                          - body
                          - translations
                required:
                  - id
                  - type
                  - category_id
                  - internal_only
                  - status
                  - default_locale
                  - available_locales
                  - title
                  - is_customer_visible
                  - can_delete
                  - has_been_published
                  - published_at
                  - published_by
                  - archived_at
                  - archived_by
                  - created_at
                  - updated_at
                  - null
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '422':
          $ref: '#/components/responses/ValidationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'The Idempotency-Key was already used for a different request (code: platform.idempotency_conflict).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '425':
          description: 'A concurrent request with the same Idempotency-Key is still in flight (code: platform.idempotency_in_flight).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
        -
          name: Idempotency-Key
