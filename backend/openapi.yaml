openapi: 3.1.0
info:
  title: 'Ragab CRM API'
  version: 1.0.0
  description: 'Ragab CRM API. Errors are RFC 9457 application/problem+json documents whose `code` member is a stable `module.condition` identifier. Write endpoints require an Idempotency-Key header (ULID or UUID).'
servers:
  -
    url: /api/v1
    description: 'Relative to the deployment host, e.g. http://localhost:8000 locally.'
paths:
  /audit:
    get:
      operationId: audit.index
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string
                    minItems: 0
                    maxItems: 0
                    additionalItems: false
                required:
                  - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/settings/{key}':
    put:
      operationId: settings.update
      parameters:
        -
          name: key
          in: path
          required: true
          schema:
            type: string
        -
          name: Idempotency-Key
          in: header
          required: true
          description: 'A ULID or UUID that identifies this write attempt. Repeating a request with the same key replays the stored response instead of acting twice; reusing a key with a different body returns 409. Keys are retained for 24 hours.'
          schema:
            type: string
            maxLength: 40
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                required:
                  - key
        '401':
          $ref: '#/components/responses/AuthenticationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'The Idempotency-Key was already used for a different request (code: platform.idempotency_conflict).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '425':
          description: 'A concurrent request with the same Idempotency-Key is still in flight (code: platform.idempotency_in_flight).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /attachments:
    get:
      operationId: attachments.index
      summary: 'Everything attached to one record'
      tags:
        - Attachments
      parameters:
        -
          name: owner_type
          in: query
          required: true
          schema:
            type: string
        -
          name: owner_id
          in: query
          required: true
          schema:
            type: string
            minLength: 26.0
            maxLength: 26.0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: {}
                required:
                  - data
        '422':
          $ref: '#/components/responses/ValidationException'
        '401':
          $ref: '#/components/responses/AuthenticationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: attachments.store
      tags:
        - Attachments
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StoreAttachmentRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '422':
          $ref: '#/components/responses/ValidationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'The Idempotency-Key was already used for a different request (code: platform.idempotency_conflict).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '425':
          description: 'A concurrent request with the same Idempotency-Key is still in flight (code: platform.idempotency_in_flight).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
        -
          name: Idempotency-Key
          in: header
          required: true
          description: 'A ULID or UUID that identifies this write attempt. Repeating a request with the same key replays the stored response instead of acting twice; reusing a key with a different body returns 409. Keys are retained for 24 hours.'
          schema:
            type: string
            maxLength: 40
  '/attachments/{id}':
    get:
      operationId: attachments.show
      tags:
        - Attachments
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
        '401':
          $ref: '#/components/responses/AuthenticationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/attachments/{id}/download':
    get:
      operationId: attachments.download
      description: "Never streams the bytes through this application in production: the\nredirect points at storage, which validates the signature itself. That\nkeeps large files off the web process entirely."
      summary: 'A short-lived link, or a refusal'
      tags:
        - Attachments
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/AuthenticationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /audit-entries:
    get:
      operationId: audit-entries.index
      tags:
        - AuditEntries
      parameters:
        -
          name: actor_id
          in: query
          schema:
            type: string
            maxLength: 64.0
        -
          name: actor_search
          in: query
          schema:
            type: string
            maxLength: 255.0
        -
          name: action
          in: query
          schema:
            type: string
            enum:
              - auth.sign_in.succeeded
              - auth.sign_in.failed
              - user.created
              - user.updated
              - user.deactivated
              - user.reactivated
              - department.created
              - department.updated
              - department.deleted
              - config.changed
              - ticket.field_changed
              - customer.field_changed
        -
          name: from
          in: query
          schema:
            type: string
            format: date
        -
          name: to
          in: query
          schema:
            type: string
            format: date
        -
          name: per_page
          in: query
          schema:
            type: integer
            minimum: 1.0
            maximum: 100.0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        occurred_at:
                          type: string
                        actor:
                          type: object
                          properties:
                            id:
                              type:
                                - string
                                - 'null'
                            type:
                              type: string
                            label:
                              type: string
                          required:
                            - id
                            - type
                            - label
                        action:
                          type: string
                        target:
                          type: object
                          properties:
                            type:
                              type:
                                - string
                                - 'null'
                            id:
                              type:
                                - string
                                - 'null'
                          required:
                            - type
                            - id
                        source_ip:
                          type:
                            - string
                            - 'null'
                        request_id:
                          type:
                            - string
                            - 'null'
                      required:
                        - id
                        - occurred_at
                        - actor
                        - action
                        - target
                        - source_ip
                        - request_id
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                      last_page:
                        type: integer
                    required:
                      - page
                      - per_page
                      - total
                      - last_page
                  actions:
                    type: array
                    items:
                      type: string
                required:
                  - data
                  - meta
                  - actions
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '422':
          $ref: '#/components/responses/ValidationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/audit-entries/{id}':
    get:
      operationId: audit-entries.show
      tags:
        - AuditEntries
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  occurred_at:
                    type: string
                  actor:
                    type: object
                    properties:
                      id:
                        type:
                          - string
                          - 'null'
                      type:
                        type: string
                      label:
                        type: string
                    required:
                      - id
                      - type
                      - label
                  action:
                    type: string
                  target:
                    type: object
                    properties:
                      type:
                        type:
                          - string
                          - 'null'
                      id:
                        type:
                          - string
                          - 'null'
                    required:
                      - type
                      - id
                  before:
                    type:
                      - object
                      - 'null'
                    additionalProperties: {}
                  after:
                    type:
                      - object
                      - 'null'
                    additionalProperties: {}
                  source_ip:
                    type:
                      - string
                      - 'null'
                  request_id:
                    type:
                      - string
                      - 'null'
                required:
                  - id
                  - occurred_at
                  - actor
                  - action
                  - target
                  - before
                  - after
                  - source_ip
                  - request_id
        '401':
          $ref: '#/components/responses/AuthenticationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/login:
    post:
      operationId: auth.login
      summary: 'Sign in'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  email:
                    type: string
                  preferred_locale:
                    type: string
                  roles:
                    type: array
                    items:
                      type: string
                required:
                  - id
                  - name
                  - email
                  - preferred_locale
                  - roles
        '422':
          $ref: '#/components/responses/ValidationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/session:
    get:
      operationId: auth.session
      summary: "Session timing, so the frontend can warn before a session lapses rather\nthan discovering it on the next request"
      tags:
        - Auth
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  inactivity_minutes:
                    type: integer
                  authenticated:
                    type: boolean
                required:
                  - inactivity_minutes
                  - authenticated
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/logout:
    post:
      operationId: auth.logout
      summary: 'Sign out and destroy the session'
      tags:
        - Auth
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required:
                  - status
        '401':
          $ref: '#/components/responses/AuthenticationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/me:
    get:
      operationId: auth.me
      summary: 'The signed-in staff member'
      tags:
        - Auth
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  email:
                    type: string
                  preferred_locale:
                    type: string
                  roles:
                    type: array
                    items:
                      type: string
                required:
                  - id
                  - name
                  - email
                  - preferred_locale
                  - roles
        '401':
          $ref: '#/components/responses/AuthenticationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /admin/categories:
    get:
      operationId: admin.categories.index
      tags:
        - Categories
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: object
                          properties:
                            en:
                              type: string
                            ar:
                              type: string
                          required:
                            - en
                            - ar
                        sort_order:
                          type: integer
                      required:
                        - id
                        - name
                        - sort_order
                required:
                  - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: admin.categories.store
      tags:
        - Categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: object
                  properties:
                    en:
                      type: string
                      description: "No `parent` rule, because there is no parent. The list is flat by\nconstruction — see the migration."
                      minLength: 1.0
                      maxLength: 120.0
                    ar:
                      type: string
                      minLength: 1.0
                      maxLength: 120.0
                  required:
                    - en
                    - ar
              required:
                - name
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: object
                    properties:
                      en:
                        type: string
                      ar:
                        type: string
                    required:
                      - en
                      - ar
                  sort_order:
                    type: integer
                required:
                  - id
                  - name
                  - sort_order
        '422':
          $ref: '#/components/responses/ValidationException'
        '401':
          $ref: '#/components/responses/AuthenticationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'The Idempotency-Key was already used for a different request (code: platform.idempotency_conflict).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '425':
          description: 'A concurrent request with the same Idempotency-Key is still in flight (code: platform.idempotency_in_flight).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
        -
          name: Idempotency-Key
          in: header
          required: true
          description: 'A ULID or UUID that identifies this write attempt. Repeating a request with the same key replays the stored response instead of acting twice; reusing a key with a different body returns 409. Keys are retained for 24 hours.'
          schema:
            type: string
            maxLength: 40
  '/admin/categories/{category}':
    patch:
      operationId: admin.categories.update
      tags:
        - Categories
      parameters:
        -
          name: category
          in: path
          required: true
          description: 'The category ID'
          schema:
            type: integer
        -
          name: Idempotency-Key
          in: header
          required: true
          description: 'A ULID or UUID that identifies this write attempt. Repeating a request with the same key replays the stored response instead of acting twice; reusing a key with a different body returns 409. Keys are retained for 24 hours.'
          schema:
            type: string
            maxLength: 40
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: object
                  properties:
                    en:
                      type: string
                      description: "No `parent` rule, because there is no parent. The list is flat by\nconstruction — see the migration."
                      minLength: 1.0
                      maxLength: 120.0
                    ar:
                      type: string
                      minLength: 1.0
                      maxLength: 120.0
                  required:
                    - en
                    - ar
              required:
                - name
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: object
                    properties:
                      en:
                        type: string
                      ar:
                        type: string
                    required:
                      - en
                      - ar
                  sort_order:
                    type: integer
                required:
                  - id
                  - name
                  - sort_order
        '422':
          $ref: '#/components/responses/ValidationException'
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '401':
          $ref: '#/components/responses/AuthenticationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'The Idempotency-Key was already used for a different request (code: platform.idempotency_conflict).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '425':
          description: 'A concurrent request with the same Idempotency-Key is still in flight (code: platform.idempotency_in_flight).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      operationId: admin.categories.destroy
      summary: 'Delete — refused while tickets still use it'
      tags:
        - Categories
      parameters:
        -
          name: category
          in: path
          required: true
          description: 'The category ID'
          schema:
            type: integer
        -
          name: Idempotency-Key
          in: header
          required: true
          description: 'A ULID or UUID that identifies this write attempt. Repeating a request with the same key replays the stored response instead of acting twice; reusing a key with a different body returns 409. Keys are retained for 24 hours.'
          schema:
            type: string
            maxLength: 40
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
                required:
                  - deleted
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '401':
          $ref: '#/components/responses/AuthenticationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'The Idempotency-Key was already used for a different request (code: platform.idempotency_conflict).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '425':
          description: 'A concurrent request with the same Idempotency-Key is still in flight (code: platform.idempotency_in_flight).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/tickets/{ticket}/customer-context':
    get:
      operationId: tickets.customer-context
      tags:
        - CustomerContext
      parameters:
        -
          name: ticket
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
        '401':
          $ref: '#/components/responses/AuthenticationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /customers/duplicates/preview:
    post:
      operationId: customers.duplicates.preview
      tags:
        - CustomerDuplicates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewDuplicatesRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches:
                    type: array
                    items:
                      type: object
                      properties:
                        customer_id:
                          type: string
                        reference:
                          type: string
                        full_name:
                          type: string
                        state:
                          type: string
                        matched_value:
                          type: string
                        matched_kind:
                          type: string
                      required:
                        - customer_id
                        - reference
                        - full_name
                        - state
                        - matched_value
                        - matched_kind
                required:
                  - matches
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '422':
          $ref: '#/components/responses/ValidationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/customers/{customerId}/notes':
    get:
      operationId: customers.notes.index
      tags:
        - CustomerNotes
      parameters:
        -
          name: customerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: {}
                required:
                  - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: customers.notes.store
      tags:
        - CustomerNotes
      parameters:
        -
          name: customerId
          in: path
          required: true
          schema:
            type: string
        -
          name: Idempotency-Key
          in: header
          required: true
          description: 'A ULID or UUID that identifies this write attempt. Repeating a request with the same key replays the stored response instead of acting twice; reusing a key with a different body returns 409. Keys are retained for 24 hours.'
          schema:
            type: string
            maxLength: 40
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  minLength: 1.0
                  maxLength: 5000.0
              required:
                - body
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
        '422':
          $ref: '#/components/responses/ValidationException'
        '401':
          $ref: '#/components/responses/AuthenticationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'The Idempotency-Key was already used for a different request (code: platform.idempotency_conflict).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '425':
          description: 'A concurrent request with the same Idempotency-Key is still in flight (code: platform.idempotency_in_flight).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/notes/{noteId}':
    patch:
      operationId: customers.notes.update
      tags:
        - CustomerNotes
      parameters:
        -
          name: noteId
          in: path
