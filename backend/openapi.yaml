  '/users/{user}/deactivate':
    post:
      operationId: users.deactivate
      summary: 'Deactivate, never delete'
      tags:
        - Users
      parameters:
        -
          name: user
          in: path
          required: true
          description: 'The user ID'
          schema:
            type: integer
        -
          name: Idempotency-Key
          in: header
          required: true
          description: 'A ULID or UUID that identifies this write attempt. Repeating a request with the same key replays the stored response instead of acting twice; reusing a key with a different body returns 409. Keys are retained for 24 hours.'
          schema:
            type: string
            maxLength: 40
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  email:
                    type: string
                  role:
                    type:
                      - string
                      - 'null'
                  department_id:
                    type:
                      - integer
                      - 'null'
                  is_active:
                    type: boolean
                required:
                  - id
                  - name
                  - email
                  - role
                  - department_id
                  - is_active
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '401':
          $ref: '#/components/responses/AuthenticationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'The Idempotency-Key was already used for a different request (code: platform.idempotency_conflict).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '425':
          description: 'A concurrent request with the same Idempotency-Key is still in flight (code: platform.idempotency_in_flight).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /inbound/web-form/attachments:
    post:
      operationId: channels.web_form.attachments
      tags:
        - WebFormAttachment
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                session_token:
                  type: string
                  minLength: 26.0
                  maxLength: 26.0
                file:
                  type: string
                  format: binary
                  contentMediaType: application/octet-stream
              required:
                - session_token
                - file
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
        '422':
          $ref: '#/components/responses/ValidationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'The Idempotency-Key was already used for a different request (code: platform.idempotency_conflict).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '425':
          description: 'A concurrent request with the same Idempotency-Key is still in flight (code: platform.idempotency_in_flight).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
        -
          name: Idempotency-Key
          in: header
          required: true
          description: 'A ULID or UUID that identifies this write attempt. Repeating a request with the same key replays the stored response instead of acting twice; reusing a key with a different body returns 409. Keys are retained for 24 hours.'
          schema:
            type: string
            maxLength: 40
  /inbound/web-form/session:
    get:
      operationId: channels.web_form.session
      description: "The form needs somewhere to put a file before the ticket that will own it\nexists. Without a token the alternative is an upload endpoint that\naccepts anything from anyone, which is a public file store.\n\nThe categories come back with it, because the form needs them and the\nauthenticated `/ticket-categories` endpoint is gated on `ticket.read` —\nwhich a stranger does not have. One public call rather than a second\npublic endpoint duplicating the same list."
      summary: 'A token anonymous uploads hang off, issued when the page is drawn'
      tags:
        - WebFormIntake
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_token:
                    type: string
                  expires_at:
                    type: string
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                      required:
                        - id
                        - name
                required:
                  - session_token
                  - expires_at
                  - categories
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /inbound/web-form:
    post:
      operationId: channels.web_form.store
      tags:
        - WebFormIntake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitWebFormRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  reference:
                    type: string
                required:
                  - status
        '422':
          $ref: '#/components/responses/ValidationException'
        default:
          description: 'An RFC 9457 problem document.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'The Idempotency-Key was already used for a different request (code: platform.idempotency_conflict).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '425':
          description: 'A concurrent request with the same Idempotency-Key is still in flight (code: platform.idempotency_in_flight).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
        -
          name: Idempotency-Key
          in: header
          required: true
          description: 'A ULID or UUID that identifies this write attempt. Repeating a request with the same key replays the stored response instead of acting twice; reusing a key with a different body returns 409. Keys are retained for 24 hours.'
          schema:
            type: string
            maxLength: 40
components:
  schemas:
    AppendMessageRequest:
      type: object
      description: 'No `version` rule, deliberately — see AppendMessage.'
      properties:
        body:
          type: string
          minLength: 1.0
          maxLength: 20000.0
        direction:
          type: string
          enum:
            - inbound
            - outbound
            - internal
        attachment_ids:
          type: array
          description: "Ids of files already uploaded against this ticket. Sent as a list\nrather than as the files themselves so a slow or refused upload\nnever costs the agent the reply they typed."
          items:
            type: string
            minLength: 26.0
            maxLength: 26.0
          maxItems: 10.0
      required:
        - body
      title: AppendMessageRequest
    AssignTicketRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1.0
        assignee_id:
          type:
            - integer
            - 'null'
          description: "Present but null returns the ticket to the pool, which is a real\ninstruction and not the same as omitting the field."
      required:
        - version
        - assignee_id
      title: AssignTicketRequest
    ChangeDepartmentRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1.0
        department_id:
          type: integer
          description: "Existence is checked by the command, not by an `exists` rule, so\nthe refusal is `tickets.department_invalid` with the id echoed\nback rather than a generic validation error the UI cannot act on."
        reason:
          type:
            - string
            - 'null'
          maxLength: 500.0
      required:
        - version
        - department_id
      title: ChangeDepartmentRequest
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          description: "Proves the person at the keyboard is the account holder, not\nsomeone who found an unlocked screen."
        password:
          type: string
        password_confirmation:
          type: string
      required:
        - current_password
        - password
        - password_confirmation
      title: ChangePasswordRequest
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255.0
      required:
        - email
      title: ForgotPasswordRequest
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: "Deliberately NOT validated against the password policy. The policy\ngoverns passwords being SET; applying it here would tell an\nattacker the shape of a valid password before they ever guess one,\nand would lock out any account whose password predates a policy\nchange."
          maxLength: 255.0
        password:
          type: string
        remember:
          type: boolean
      required:
        - email
        - password
      title: LoginRequest
    PreviewDuplicatesRequest:
      type: object
      properties:
        emails:
          type: array
          items:
            type: string
            maxLength: 200.0
          maxItems: 20.0
        phones:
          type: array
          items:
            type: string
            maxLength: 200.0
          maxItems: 20.0
        exclude_customer_id:
          type: string
          description: "Set when checking an EXISTING customer's edits, so they are not\noffered as their own duplicate."
          minLength: 26.0
          maxLength: 26.0
      title: PreviewDuplicatesRequest
    RegisterPortalAccountRequest:
      type: object
      description: "What a customer has to give to open an account.\n\nFour fields, and no more. Every extra one is a reason somebody abandons a\nform they only opened because something had already gone wrong."
      properties:
        name:
          type: string
          minLength: 1.0
          maxLength: 120.0
        email:
          type: string
          format: email
          maxLength: 320.0
        password:
          type: string
        preferred_locale:
          type:
            - string
            - 'null'
          description: "`nullable` as well as `sometimes`: an explicit null means \"I have\nno preference\", which is a legitimate thing for a client to say\nand different from sending nothing. Both fall back to English."
          enum:
            - en
            - ar
            - null
        password_confirmation:
          type: string
      required:
        - name
        - email
        - password
        - password_confirmation
      title: RegisterPortalAccountRequest
    ReopenTicketRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1.0
        reason:
          type:
            - string
            - 'null'
          maxLength: 500.0
      required:
        - version
      title: ReopenTicketRequest
    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
        email:
          type: string
          format: email
          maxLength: 255.0
        password:
          type: string
        password_confirmation:
          type: string
      required:
        - token
        - email
        - password
        - password_confirmation
      title: ResetPasswordRequest
    ResolveTicketRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1.0
        resolution_note:
          type: string
          minLength: 1.0
          maxLength: 2000.0
      required:
        - version
        - resolution_note
      title: ResolveTicketRequest
    StoreArticleRequest:
      type: object
      description: "The attributes of a new article. Not its words, and not its state.\n\n`status`, `has_been_published` and the lifecycle stamps are absent by\nconstruction: they belong to `ArticleLifecycle`, and a request that could\nname them could publish an article without going through the rule that makes\npublishing permanent."
      properties:
        type:
          type: string
          enum:
            - faq
            - help
            - solution
            - guide
        category_id:
          type: integer
        default_locale:
          type: string
          enum:
            - en
            - ar
        internal_only:
          type: boolean
      required:
        - type
        - category_id
        - default_locale
      title: StoreArticleRequest
    StoreAttachmentRequest:
      type: object
      properties:
        owner_type:
          type: string
          enum:
            - customer
            - ticket
            - message
            - web_form_draft
            - article
        owner_id:
          type: string
          description: "ULID-shaped, and that is as far as the check goes. Platform is T0 and cannot look inside Customers or Tickets to\nconfirm the owner exists — a query from here would invert the\ndependency graph. The owning module checks existence when it\nbuilds the upload, and an attachment pointing at nothing is\ninvisible rather than dangerous: it is only ever read through\n\"everything attached to THIS record\"."
          minLength: 26.0
          maxLength: 26.0
        file:
          type: string
          format: binary
          contentMediaType: application/octet-stream
          description: "No `max` and no `mimes` here on purpose. The size cap and the\nallow-list are runtime settings an administrator controls, and\nbaking them into a validation rule would freeze them at deploy\ntime. AttachmentUploader applies both, against the current values."
      required:
        - owner_type
        - owner_id
        - file
      title: StoreAttachmentRequest
    StoreCustomerRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1.0
          maxLength: 200.0
        department_id:
          type: integer
        preferred_channel:
          type:
            - string
            - 'null'
          enum:
            - email
            - phone
            - whatsapp
            - null
        identifiers:
          type: array
          description: "At least one way to reach them. A customer record with no contact\ndetails cannot be replied to, which makes it a name in a list\nrather than a customer."
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                  - email
                  - phone
                  - whatsapp
              value:
                type: string
                minLength: 1.0
                maxLength: 200.0
              is_primary:
                type: boolean
            required:
              - kind
              - value
          minItems: 1.0
        confirm_create_duplicate:
          type: boolean
          description: "The client's acknowledgement of an offered duplicate."
      required:
        - full_name
        - department_id
        - identifiers
      title: StoreCustomerRequest
    StoreDepartmentRequest:
      type: object
      properties:
        name:
          type: string
          description: "max:120 counts CHARACTERS, not bytes, so an Arabic department\nname is not silently shorter than an English one."
          minLength: 1.0
          maxLength: 120.0
      required:
        - name
      title: StoreDepartmentRequest
    StoreTicketRequest:
      type: object
      properties:
        subject:
          type: string
          minLength: 1.0
          maxLength: 200.0
        description:
          type: string
          minLength: 1.0
          maxLength: 20000.0
        customer_id:
          type: string
          minLength: 26.0
          maxLength: 26.0
        channel:
          type: string
          enum:
            - agent
            - portal
            - email
            - web_form
            - whatsapp
            - sms
            - system
        category_id:
          type:
            - integer
            - 'null'
        priority:
          type:
            - string
            - 'null'
          enum:
            - low
            - normal
            - high
            - urgent
            - null
        department_id:
          type:
            - integer
            - 'null'
      required:
        - subject
        - description
        - customer_id
        - channel
      title: StoreTicketRequest
    StoreUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1.0
          maxLength: 120.0
        email:
          type: string
          format: email
          maxLength: 255.0
        role:
          type: string
          enum:
            - administrator
            - supervisor
            - agent
            - customer
        department_id:
          type:
            - integer
            - 'null'
        is_active:
          type: boolean
        password:
          type:
            - string
            - 'null'
          description: "Optional: omitted means the account is created without a usable\npassword and the person sets one through the reset flow, which is\nbetter than an administrator inventing and transmitting one."
        password_confirmation:
          type:
            - string
            - 'null'
      required:
        - name
        - email
        - role
      title: StoreUserRequest
    SubmitWebFormRequest:
      type: object
      description: "The six fields, and nothing else that reaches the pipeline.\n\nThe set is fixed by the story and is not configurable: name, contact,\nsubject, category, message, attachment. Two more arrive with the request and\nneither is a field a person fills in — `hp_company` is the honeypot and\n`rendered_at` is when the page was drawn — so both are validated here and\ndropped before anything downstream sees them."
      properties:
        name:
          type: string
          maxLength: 200.0
        contact:
          type: string
          maxLength: 320.0
        subject:
          type: string
          maxLength: 200.0
        category_id:
          type: integer
        message:
          type: string
          maxLength: 20000.0
        attachment_ids:
          type: array
          items:
            type: string
            minLength: 26.0
            maxLength: 26.0
          maxItems: 10.0
        session_token:
          type:
            - string
            - 'null'
          minLength: 26.0
          maxLength: 26.0
        hp_company:
          type:
            - string
            - 'null'
          description: "Must arrive; its CONTENTS are not validated here. A 422 saying \"this field must be empty\" tells whoever wrote the\nrobot exactly which field to stop filling in. The controller\nanswers a filled honeypot with 202 and a normal-looking body\ninstead, and that only works if validation lets it through."
          maxLength: 200.0
        rendered_at:
          type: string
          format: date-time
      required:
        - name
        - contact
        - subject
        - category_id
        - message
        - hp_company
        - rendered_at
      title: SubmitWebFormRequest
    UpdateArticleRequest:
      type: object
      description: "Editing an article's attributes.\n\nRefuses the lifecycle fields OUT LOUD rather than ignoring them. A request\nthat sends `status: published` and gets a 200 back has been told its edit\nworked; discovering later that the article is still a draft is worse than\nbeing refused, and it is the kind of thing a client keeps doing."
      properties:
        type:
          type: string
          enum:
            - faq
            - help
            - solution
            - guide
        category_id:
          type: integer
        default_locale:
          type: string
          enum:
            - en
            - ar
        internal_only:
          type: boolean
      title: UpdateArticleRequest
    UpdateCustomerRequest:
      type: object
      description: "Every field optional; supplying `identifiers` replaces the whole set.\n\nReplacement rather than merge, because the form the agent is looking at shows\nthe complete list — the rows they deleted are gone from what they submit, and\na merge would silently resurrect them."
      properties:
        full_name:
          type: string
          minLength: 1.0
          maxLength: 200.0
        department_id:
          type: integer
        preferred_channel:
          type:
            - string
            - 'null'
          enum:
            - email
            - phone
            - whatsapp
            - null
        identifiers:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                  - email
                  - phone
                  - whatsapp
              value:
                type: string
                minLength: 1.0
                maxLength: 200.0
              is_primary:
                type: boolean
          minItems: 1.0
      title: UpdateCustomerRequest
    UpdateDepartmentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1.0
          maxLength: 120.0
        is_active:
          type: boolean
      required:
        - name
      title: UpdateDepartmentRequest
    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1.0
          maxLength: 120.0
        preferred_locale:
          type: string
          description: "The two locales the product ships. An unknown value is a 422\nrather than a silent fallback, so a typo surfaces at the source."
          enum:
            - en
            - ar
      title: UpdateProfileRequest
    UpdateTicketAttributesRequest:
      type: object
      description: "A partial change. Every attribute optional, the version required.\n\nThe version is required even though the guard would tolerate null, because a\ncaller who omitted it would be silently opting out of the protection this\nwhole mechanism exists for.\n\nIt may arrive in the body as `version` or in an `If-Match` header — the same\nnumber, spelled the way the caller finds natural. There is still ONE guard\nreading ONE value; a second mechanism would be a second thing to get wrong,\nand the one that is wrong is the one nobody tested."
      properties:
        version:
          type: integer
          description: 'Required only when the header did not carry it.'
          minimum: 1.0
        status:
          type: string
          enum:
            - open
            - pending
            - resolved
            - closed
        priority:
          type: string
          enum:
            - low
            - normal
            - high
            - urgent
        category_id:
          type:
            - integer
            - 'null'
        assignee_id:
          type:
            - integer
            - 'null'
        department_id:
          type:
            - integer
            - 'null'
      title: UpdateTicketAttributesRequest
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1.0
          maxLength: 120.0
        email:
          type: string
          format: email
          maxLength: 255.0
        role:
          type: string
          enum:
            - administrator
            - supervisor
            - agent
            - customer
        department_id:
          type:
            - integer
            - 'null'
        is_active:
          type: boolean
      title: UpdateUserRequest
    UpsertArticleTranslationRequest:
      type: object
      description: "One article in one language.\n\nThe body is validated as a string and nothing more. Trying to validate the\nSHAPE of HTML here would be a second, weaker copy of the sanitiser — and the\ntwo would disagree, which means either a body the validator accepts and the\nsanitiser empties, or one the validator rejects that was perfectly safe.\n`HtmlSanitiser` is the single authority, and it runs on write."
      properties:
        title:
          type: string
          minLength: 1.0
          maxLength: 200.0
        body:
          type: string
          maxLength: 200000.0
      required:
        - title
        - body
      title: UpsertArticleTranslationRequest
    Problem:
      type: object
      title: Problem
      description: 'RFC 9457 problem details. Every 4xx and 5xx response in this API has this shape.'
      properties:
        type:
          type: string
          format: uri
          description: 'A URI identifying the problem type. Always the base URI plus `code`.'
        title:
          type: string
          description: 'A short, human-readable summary.'
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type:
            - string
            - 'null'
          description: 'A human-readable explanation specific to this occurrence.'
        instance:
          type: string
          description: 'The request URI this problem occurred on.'
        code:
          type: string
          pattern: '^[a-z0-9_]+\.[a-z0-9_]+$'
          description: 'Stable machine identifier shaped `module.condition`. Branch on this, never on `title`.'
          examples:
            - platform.internal_error
            - platform.validation_failed
            - platform.unauthorized
            - platform.forbidden
            - platform.not_found
            - platform.method_not_allowed
            - platform.conflict
            - platform.too_many_requests
            - platform.request_failed
            - platform.idempotency_conflict
            - platform.idempotency_in_flight
        trace_id:
          type: string
          description: 'Correlation id for this request; matches the X-Request-Id response header and the request_id in the logs.'
        errors:
          type: object
          description: 'Present on validation failures: field name to list of messages.'
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - type
        - title
        - status
        - instance
        - code
        - trace_id
  responses:
    ValidationException:
      description: 'Validation error'
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: 'Errors overview.'
              errors:
                type: object
                description: 'A detailed description of each field that failed validation.'
                additionalProperties:
                  type: array
                  items:
                    type: string
            required:
              - message
              - errors
    AuthenticationException:
      description: Unauthenticated
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: 'Error overview.'
            required:
              - message
    AuthorizationException:
      description: 'Authorization error'
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: 'Error overview.'
            required:
              - message
    ModelNotFoundException:
      description: 'Not found'
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: 'Error overview.'
            required:
              - message
